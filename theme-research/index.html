<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>题材研究｜*ST 离离原上韭</title>
    <style>
      :root {
        color: #1d2f28;
        background: #f3f5f1;
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      a {
        color: #1d664a;
      }
      header {
        padding: 18px clamp(18px, 5vw, 64px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #dfe5e0;
        background: rgba(250, 251, 248, 0.94);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #13271f;
        font-weight: 800;
        text-decoration: none;
      }
      .brand span {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #13271f;
        color: #f0dda5;
        font-size: 22px;
      }
      header > a:last-child {
        font-size: 13px;
        text-decoration: none;
      }
      main {
        width: min(100% - 32px, 980px);
        margin: 0 auto;
        padding: 48px 0 64px;
      }
      .loading,
      .error {
        padding: 32px;
        border-radius: 16px;
        background: white;
        text-align: center;
      }
      article {
        display: none;
      }
      .hero {
        padding: 28px;
        border: 1px solid #dfe5e0;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 16px 42px rgba(35, 62, 52, 0.07);
      }
      .meta {
        margin: 0 0 10px;
        color: #78867f;
        font-size: 13px;
      }
      h1 {
        margin: 0;
        color: #13271f;
        font-size: clamp(28px, 5vw, 46px);
      }
      .theme-line {
        margin: 14px 0 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .theme-line span {
        padding: 7px 10px;
        border-radius: 999px;
        background: #e8f1eb;
        color: #315c49;
        font-size: 13px;
      }
      .strength {
        margin-left: auto;
        color: #8b6a21;
        font-size: 14px;
        font-weight: 700;
      }
      .strength strong {
        margin-left: 5px;
        font-family: ui-monospace, monospace;
        font-size: 28px;
      }
      .summary {
        margin: 22px 0 0;
        color: #42564d;
        line-height: 1.85;
      }
      .grid {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      section {
        padding: 24px;
        border: 1px solid #dfe5e0;
        border-radius: 16px;
        background: white;
      }
      section.sources {
        grid-column: 1 / -1;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 17px;
      }
      section p,
      li {
        color: #52645c;
        font-size: 14px;
        line-height: 1.8;
      }
      ul,
      ol {
        margin: 0;
        padding-left: 22px;
      }
      .sources li + li {
        margin-top: 10px;
      }
      .source-meta {
        margin-left: 7px;
        color: #8a958f;
        font-size: 12px;
      }
      footer {
        margin-top: 20px;
        color: #89958f;
        font-size: 12px;
        text-align: center;
      }
      @media (max-width: 680px) {
        main {
          padding-top: 28px;
        }
        .hero,
        section {
          padding: 20px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        section.sources {
          grid-column: auto;
        }
        .strength {
          width: 100%;
          margin: 6px 0 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="../">
        <span>韭</span>
        *ST 离离原上韭
      </a>
      <a href="../">返回市场看板</a>
    </header>
    <main>
      <div class="loading" id="loading">正在读取题材研究…</div>
      <div class="error" id="error" hidden></div>
      <article id="report">
        <div class="hero">
          <p class="meta" id="meta"></p>
          <h1 id="title"></h1>
          <div class="theme-line" id="themes"></div>
          <p class="summary" id="summary"></p>
        </div>
        <div class="grid">
          <section>
            <h2>行业前景</h2>
            <p id="outlook"></p>
          </section>
          <section>
            <h2>题材逻辑</h2>
            <p id="logic"></p>
          </section>
          <section>
            <h2>主要风险</h2>
            <ul id="risks"></ul>
          </section>
          <section class="sources">
            <h2>分析信息源</h2>
            <ol id="sources"></ol>
          </section>
        </div>
        <footer id="generated"></footer>
      </article>
    </main>
    <script>
      const LIVE_USER_STATE_URL =
        "https://dividend-research-dashboard.lybwzy2002.chatgpt.site/api/user-state";
      const CUSTOM_STOCKS_STORAGE_KEY = "dividend-research:custom-stocks:v1";
      const STOCK_ANALYSES_STORAGE_KEY = "dividend-research:stock-analyses:v1";
      const params = new URLSearchParams(window.location.search);
      const symbol = params.get("symbol") || "";
      const loading = document.querySelector("#loading");
      const error = document.querySelector("#error");
      const report = document.querySelector("#report");

      function showError(message) {
        loading.hidden = true;
        error.hidden = false;
        error.textContent = message;
      }

      function appendTextList(target, values) {
        for (const value of values || []) {
          const item = document.createElement("li");
          item.textContent = value;
          target.append(item);
        }
      }

      function readStoredJson(key, fallback) {
        try {
          const value = JSON.parse(window.localStorage.getItem(key) || "null");
          return value ?? fallback;
        } catch {
          return fallback;
        }
      }

      function isRawThemeSourceUrl(url) {
        return String(url || "").includes(
          "emweb.securities.eastmoney.com/PC_HSF10/CoreConception",
        );
      }

      function buildGeneratedReport(stock, analysis) {
        if (!stock) return null;
        const theme = stock.themeInfo || {};
        const rawThemeUrl =
          theme.sourceUrl || (isRawThemeSourceUrl(theme.url) ? theme.url : null);
        const sources = [];
        if (rawThemeUrl) {
          sources.push({
            title: `${stock.name}主营与题材资料`,
            url: rawThemeUrl,
            publishedAt: theme.generatedAt
              ? new Date(theme.generatedAt).toISOString().slice(0, 10)
              : null,
            sourceType: "东方财富 F10",
          });
        }
        if (stock.financialReport?.url) {
          sources.push({
            title: stock.financialReport.title || `${stock.name}最新财报`,
            url: stock.financialReport.url,
            publishedAt: stock.financialReport.publishedAt,
            sourceType: stock.financialReport.source || "公司公告",
          });
        }

        const summaryParts = [theme.businessSummary, analysis?.conclusion].filter(Boolean);
        const outlookParts = [theme.industryOutlook, analysis?.industryTheme].filter(Boolean);
        const logicParts = [
          analysis?.fundamentals,
          analysis?.latestReport,
          analysis?.valuation,
          analysis?.momentum,
        ].filter(Boolean);
        const risks = [...(stock.riskFlags || [])];
        if (analysis?.risk && !risks.includes(analysis.risk)) risks.push(analysis.risk);

        return {
          symbol: stock.symbol,
          name: stock.name,
          industry: stock.industry || "待核验",
          industrySector: stock.industrySector || "其他",
          primaryTheme: theme.primaryTheme || "题材研究待补充",
          themes: theme.themes?.length
            ? theme.themes
            : [theme.primaryTheme].filter(Boolean),
          strength: Number.isFinite(Number(theme.score)) ? Number(theme.score) : 0,
          summary:
            summaryParts.join(" ") ||
            `${stock.name}的主营与基本面资料已刷新，仍需结合最新公告持续核验。`,
          industryOutlook:
            outlookParts.join(" ") || "行业前景资料暂不完整，需结合公开行业数据继续跟踪。",
          themeLogic:
            logicParts.join(" ") || "本次分析已更新题材、财报和行情资料，暂未形成更多可验证结论。",
          risks: risks.length ? risks : ["公开资料有限，需持续核验公告与经营变化"],
          sources,
          generatedAt:
            analysis?.generatedAt || theme.generatedAt || stock.asOf || new Date().toISOString(),
        };
      }

      function readLocalGeneratedReport() {
        const stocks = readStoredJson(CUSTOM_STOCKS_STORAGE_KEY, []);
        const analyses = readStoredJson(STOCK_ANALYSES_STORAGE_KEY, {});
        const stock = Array.isArray(stocks)
          ? stocks.find((item) => item?.symbol === symbol)
          : null;
        return buildGeneratedReport(stock, analyses?.[symbol]);
      }

      async function readAccountGeneratedReport() {
        const isSitesHost = window.location.hostname.endsWith(".chatgpt.site");
        const response = await fetch(isSitesHost ? "/api/user-state" : LIVE_USER_STATE_URL, {
          cache: "no-store",
          credentials: "include",
          headers: { accept: "application/json" },
        });
        if (!response.ok) throw new Error(`账户报告 HTTP ${response.status}`);
        const payload = await response.json();
        const stock = Array.isArray(payload.customStocks)
          ? payload.customStocks.find((item) => item?.symbol === symbol)
          : null;
        return buildGeneratedReport(stock, payload.detailedAnalyses?.[symbol]);
      }

      async function loadReport() {
        if (!symbol) throw new Error("链接中缺少股票代码");
        try {
          const response = await fetch(`../theme-research.json?refresh=${Date.now()}`, {
            cache: "no-store",
            headers: { accept: "application/json" },
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          if (payload?.stocks?.[symbol]) return payload.stocks[symbol];
        } catch (cause) {
          console.warn("Unable to load the published theme research", cause);
        }

        const localReport = readLocalGeneratedReport();
        if (localReport) return localReport;
        try {
          const accountReport = await readAccountGeneratedReport();
          if (accountReport) return accountReport;
        } catch (cause) {
          console.warn("Unable to load the account-generated report", cause);
        }
        throw new Error(`未找到 ${symbol} 的分析报告，请返回市场看板重新生成`);
      }

      function renderReport(item) {
        document.title = `${item.name}题材研究｜*ST 离离原上韭`;
        document.querySelector("#meta").textContent =
          `${item.symbol} · ${item.industry} · ${item.industrySector}`;
        document.querySelector("#title").textContent =
          `${item.name}｜${item.primaryTheme}`;
        const themes = document.querySelector("#themes");
        for (const theme of item.themes || []) {
          const chip = document.createElement("span");
          chip.textContent = theme;
          themes.append(chip);
        }
        const strength = document.createElement("div");
        strength.className = "strength";
        strength.append("题材强度");
        const strengthValue = document.createElement("strong");
        strengthValue.textContent = Number(item.strength).toFixed(0);
        strength.append(strengthValue);
        themes.append(strength);
        document.querySelector("#summary").textContent = item.summary;
        document.querySelector("#outlook").textContent = item.industryOutlook;
        document.querySelector("#logic").textContent = item.themeLogic;
        appendTextList(document.querySelector("#risks"), item.risks);
        const sources = document.querySelector("#sources");
        for (const source of item.sources || []) {
          const row = document.createElement("li");
          const link = document.createElement("a");
          link.href = source.url;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = source.title;
          row.append(link);
          const meta = document.createElement("span");
          meta.className = "source-meta";
          meta.textContent = [source.sourceType, source.publishedAt]
            .filter(Boolean)
            .join(" · ");
          row.append(meta);
          sources.append(row);
        }
        document.querySelector("#generated").textContent =
          `由 Codex 基于公开信息生成 · ${new Date(item.generatedAt).toLocaleString("zh-CN")} · 仅供研究参考`;
        loading.hidden = true;
        report.style.display = "block";
      }

      loadReport()
        .then(renderReport)
        .catch((cause) => showError(`题材研究读取失败：${cause.message}`));
    </script>
  </body>
</html>
