<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>产业链分析｜*ST 离离原上韭</title>
    <style>
      :root {
        color: #1d2f28;
        background: #f3f5f1;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      a { color: #1d664a; }
      header {
        padding: 18px clamp(18px, 5vw, 64px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #dfe5e0;
        background: rgba(250, 251, 248, 0.94);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #13271f;
        font-weight: 800;
        text-decoration: none;
      }
      .brand span {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #13271f;
        color: #f0dda5;
        font-size: 22px;
      }
      header > a:last-child { font-size: 13px; text-decoration: none; }
      main {
        width: min(100% - 32px, 1120px);
        margin: 0 auto;
        padding: 48px 0 64px;
      }
      .loading, .error {
        padding: 32px;
        border-radius: 16px;
        background: white;
        text-align: center;
      }
      #report { display: none; }
      .hero {
        padding: 28px;
        border: 1px solid #dfe5e0;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 16px 42px rgba(35, 62, 52, 0.07);
      }
      .meta { margin: 0 0 10px; color: #78867f; font-size: 13px; }
      h1 { margin: 0; color: #13271f; font-size: clamp(28px, 5vw, 46px); }
      .score-line {
        margin: 15px 0 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .rating {
        padding: 7px 11px;
        border-radius: 999px;
        background: #e8f1eb;
        color: #315c49;
        font-size: 13px;
        font-weight: 700;
      }
      .score { margin-left: auto; color: #8b6a21; font-size: 14px; font-weight: 700; }
      .score strong {
        margin-left: 5px;
        font-family: ui-monospace, monospace;
        font-size: 28px;
      }
      .summary { margin: 22px 0 0; color: #42564d; line-height: 1.85; }
      .position {
        margin: 18px 0 0;
        padding: 14px 16px;
        border-left: 3px solid #4b8068;
        border-radius: 0 10px 10px 0;
        background: #f1f6f2;
        color: #3b5147;
        font-size: 14px;
        line-height: 1.75;
      }
      .position strong { display: block; margin-bottom: 3px; color: #1e4936; }
      .chain {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        align-items: stretch;
      }
      .chain-column, section {
        border: 1px solid #dfe5e0;
        border-radius: 16px;
        background: #fff;
      }
      .chain-column { min-width: 0; padding: 22px; }
      .chain-column h2, section h2 { margin: 0 0 12px; font-size: 17px; }
      .chain-summary { margin: 0 0 15px; color: #52645c; font-size: 13px; line-height: 1.75; }
      .node-list { min-width: 0; display: grid; gap: 10px; }
      .node {
        min-width: 0;
        padding: 13px;
        border: 1px solid #e5eae6;
        border-radius: 11px;
        background: #fafbf9;
      }
      .node-head {
        display: grid;
        grid-template-columns: minmax(108px, 0.7fr) minmax(0, 1.3fr);
        align-items: start;
        gap: 10px;
      }
      .node-head strong { min-width: 0; color: #233f33; font-size: 14px; overflow-wrap: anywhere; }
      .node-head span { min-width: 0; color: #85671f; font-size: 12px; overflow-wrap: anywhere; }
      .node p { min-width: 0; margin: 7px 0 0; color: #5a6b63; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
      .node .evidence { color: #7c8983; }
      .node-insights { margin-top: 10px; padding-top: 9px; border-top: 1px dashed #dce5de; }
      .node-insights p { margin: 4px 0 0; }
      .node-insights strong { color: #315c49; }
      .futures-kline { min-width: 0; margin-top: 12px; padding: 11px; border-radius: 10px; background: #f3f7f4; overflow: hidden; }
      .futures-kline-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .futures-kline-head strong { color: #315c49; font-size: 12px; }
      .futures-kline-meta { margin: 4px 0 8px; color: #7a8981; font-size: 11px; line-height: 1.5; }
      .kline-plot { min-width: 0; display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 7px; }
      .kline-y-axis { height: 112px; display: flex; flex-direction: column; justify-content: space-between; padding: 3px 0 2px; color: #89958f; font-size: 9px; line-height: 1; text-align: right; }
      .kline-axis-label { white-space: nowrap; }
      .kline-chart-wrap { position: relative; min-width: 0; }
      .kline-gridlines { position: absolute; inset: 5px 0 0; pointer-events: none; }
      .kline-gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed #d5e0d8; }
      .kline-chart { position: relative; z-index: 1; width: 100%; min-width: 0; height: 112px; display: flex; align-items: stretch; gap: 1px; padding: 5px 2px 0; }
      .kline-column { position: relative; flex: 1; min-width: 0; height: 100%; }
      .kline-wick, .kline-body { position: absolute; left: 50%; transform: translateX(-50%); display: block; }
      .kline-wick { width: 1px; background: #4b8068; }
      .kline-body { width: min(14px, 58%); min-height: 3px; border: 1px solid #4b8068; background: #e8f1eb; }
      .kline-column.down .kline-wick { background: #b35e53; }
      .kline-column.down .kline-body { border-color: #b35e53; background: #f9e9e6; }
      .futures-kline-sources { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 5px 10px; }
      .futures-kline-sources a { color: #47745e; font-size: 10px; text-decoration: none; }
      .futures-kline-sources a:hover { text-decoration: underline; }
      .grid {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      section { padding: 24px; }
      section.wide { grid-column: 1 / -1; }
      section p, li { color: #52645c; font-size: 14px; line-height: 1.8; }
      section p { margin: 0; }
      ul, ol { margin: 0; padding-left: 22px; }
      .outlook { border-color: #d8c999; background: linear-gradient(135deg, #fffdf7, #fff); }
      .sources li { margin-bottom: 11px; }
      .sources a { font-weight: 700; text-decoration: none; }
      .sources a:hover { text-decoration: underline; text-underline-offset: 3px; }
      .source-meta { display: block; color: #89958f; font-size: 12px; }
      .notice {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #eef2ef;
        color: #74817b;
        font-size: 12px;
        line-height: 1.7;
      }
      footer { margin-top: 20px; color: #89958f; font-size: 12px; text-align: center; }
      @media (max-width: 760px) {
        main { padding-top: 28px; }
        .hero, section, .chain-column { padding: 20px; }
        .chain, .grid { grid-template-columns: 1fr; }
        .node-head { grid-template-columns: 1fr; gap: 4px; }
        section.wide { grid-column: auto; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="../"><span>韭</span>*ST 离离原上韭</a>
      <a href="../">返回市场看板</a>
    </header>
    <main>
      <div class="loading" id="loading">正在读取上下游供需与产业链强度分析…</div>
      <div class="error" id="error" hidden></div>
      <article id="report">
        <div class="hero">
          <p class="meta" id="meta"></p>
          <h1 id="title"></h1>
          <div class="score-line">
            <span class="rating" id="rating"></span>
            <span class="score">产业链强度<strong id="score"></strong></span>
          </div>
          <p class="summary" id="summary"></p>
          <div class="position"><strong>公司所处位置</strong><span id="position"></span></div>
        </div>
        <div class="chain">
          <section class="chain-column">
            <h2>上游供应</h2>
            <p class="chain-summary" id="upstream-summary"></p>
            <div class="node-list" id="upstream"></div>
          </section>
          <section class="chain-column">
            <h2>下游承接 / 消费</h2>
            <p class="chain-summary" id="downstream-summary"></p>
            <div class="node-list" id="downstream"></div>
          </section>
        </div>
        <div class="grid">
          <section class="wide"><h2>供需传导逻辑</h2><p id="transmission"></p></section>
          <section class="wide outlook"><h2>未来 1—4 个季度展望</h2><p id="outlook"></p></section>
          <section><h2>关键跟踪指标</h2><ul id="indicators"></ul></section>
          <section><h2>潜在催化</h2><ul id="catalysts"></ul></section>
          <section><h2>主要风险</h2><ul id="risks"></ul></section>
          <section class="sources"><h2>分析信息源</h2><ol id="sources"></ol></section>
        </div>
        <div class="notice">
          本页衡量的是产业链供需、传导与景气强度，不等同于股票涨跌预测；结果基于公开资料，
          需结合后续订单、库存、价格和公司公告持续验证，不构成个性化投资建议。
        </div>
        <footer id="generated"></footer>
      </article>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const symbol = params.get("symbol") || "";
      const loading = document.querySelector("#loading");
      const error = document.querySelector("#error");
      const report = document.querySelector("#report");

      function showError(message) {
        loading.hidden = true;
        error.hidden = false;
        error.textContent = message;
      }

      function appendTextList(target, values) {
        for (const value of values || []) {
          const item = document.createElement("li");
          item.textContent = value;
          target.append(item);
        }
      }

      function appendFuturesKline(target, futures) {
        if (!futures || futures.availability !== "available" || !Array.isArray(futures.bars) || futures.bars.length !== 26) {
          return;
        }

        const panel = document.createElement("div");
        panel.className = "futures-kline";
        const head = document.createElement("div");
        head.className = "futures-kline-head";
        const title = document.createElement("strong");
        title.textContent = "对应产业期货 · 最近6个月周K（约26周）";
        head.append(title);
        panel.append(head);

        const meta = document.createElement("p");
        meta.className = "futures-kline-meta";
        meta.textContent = [
          futures.commodity,
          futures.contract,
          futures.exchange,
          futures.priceUnit,
        ].filter(Boolean).join(" · ");
        panel.append(meta);

        const values = futures.bars.flatMap((bar) => [Number(bar.low), Number(bar.high)]);
        const low = Math.min(...values);
        const high = Math.max(...values);
        const range = high - low || 1;
        const y = (value) => ((high - value) / range) * 100;
        const chart = document.createElement("div");
        chart.className = "kline-chart";
        chart.setAttribute("aria-label", "最近六个月期货周K线（约26周）");
        for (const bar of futures.bars) {
          const open = Number(bar.open);
          const close = Number(bar.close);
          const barHigh = Number(bar.high);
          const barLow = Number(bar.low);
          const column = document.createElement("div");
          column.className = `kline-column ${close < open ? "down" : "up"}`;
          column.title = `${bar.week} 开${open} 高${barHigh} 低${barLow} 收${close}`;
          const wick = document.createElement("span");
          wick.className = "kline-wick";
          wick.style.top = `${y(barHigh)}%`;
          wick.style.height = `${Math.max(2, y(barLow) - y(barHigh))}%`;
          const body = document.createElement("span");
          body.className = "kline-body";
          body.style.top = `${y(Math.max(open, close))}%`;
          body.style.height = `${Math.max(3, y(Math.min(open, close)) - y(Math.max(open, close)))}%`;
          column.append(wick, body);
          chart.append(column);
        }
        const plot = document.createElement("div");
        plot.className = "kline-plot";
        const axis = document.createElement("div");
        axis.className = "kline-y-axis";
        axis.setAttribute("aria-label", `${futures.priceUnit || "价格"}纵轴`);
        const tickCount = 5;
        for (let index = 0; index < tickCount; index += 1) {
          const tick = document.createElement("span");
          tick.className = "kline-axis-label";
          const value = high - (range * index) / (tickCount - 1);
          tick.textContent = formatAxisValue(value);
          axis.append(tick);
        }
        const chartWrap = document.createElement("div");
        chartWrap.className = "kline-chart-wrap";
        const gridlines = document.createElement("div");
        gridlines.className = "kline-gridlines";
        for (let index = 0; index < tickCount; index += 1) {
          const line = document.createElement("span");
          line.className = "kline-gridline";
          line.style.top = `${(index / (tickCount - 1)) * 100}%`;
          gridlines.append(line);
        }
        chartWrap.append(gridlines, chart);
        plot.append(axis, chartWrap);
        panel.append(plot);
        const sources = document.createElement("div");
        sources.className = "futures-kline-sources";
        for (const source of futures.sources || []) {
          const link = document.createElement("a");
          link.href = source.url;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = `${source.title} · ${source.trustLevel || "已筛选"}`;
          sources.append(link);
        }
        panel.append(sources);
        target.append(panel);
      }

      function formatAxisValue(value) {
        if (!Number.isFinite(value)) return "-";
        return value.toLocaleString("zh-CN", {
          maximumFractionDigits: Math.abs(value) >= 1000 ? 0 : 2,
        });
      }

      function nodeWeight(value) {
        const explicitWeight = Number(value?.weight);
        if (Number.isFinite(explicitWeight)) return explicitWeight;
        return value?.futuresKline?.availability === "available" ? 1 : 0;
      }

      function appendChainNodes(target, values, side) {
        const orderedValues = (values || [])
          .map((value, index) => ({ value, index }))
          .sort(
            (left, right) =>
              nodeWeight(right.value) - nodeWeight(left.value) || left.index - right.index,
          )
          .map(({ value }) => value);
        for (const value of orderedValues) {
          const node = document.createElement("article");
          node.className = "node";
          const head = document.createElement("div");
          head.className = "node-head";
          const segment = document.createElement("strong");
          segment.textContent = value.segment;
          const status = document.createElement("span");
          status.textContent = value.status;
          head.append(segment, status);
          const relationship = document.createElement("p");
          relationship.textContent = value.relationship;
          const evidence = document.createElement("p");
          evidence.className = "evidence";
          evidence.textContent = `依据：${value.evidence}`;
          const insights = document.createElement("div");
          insights.className = "node-insights";
          const capability = document.createElement("p");
          const capabilityLabel = side === "upstream" ? "自主供应能力" : "下游议价权";
          const capabilityStrong = document.createElement("strong");
          capabilityStrong.textContent = capabilityLabel;
          capability.append(capabilityStrong, document.createTextNode(` ${side === "upstream" ? value.selfSupplyCapability || "未提供" : value.pricingPower || "未提供"}`));
          insights.append(capability);
          node.append(head, relationship, evidence, insights);
          appendFuturesKline(node, value.futuresKline);
          target.append(node);
        }
      }

      async function loadReport() {
        if (!symbol) throw new Error("链接中缺少股票代码");
        const response = await fetch(`../industry-chain-research.json?refresh=${Date.now()}`, {
          cache: "no-store",
          headers: { accept: "application/json" },
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const item = payload?.stocks?.[symbol];
        if (!item) {
          throw new Error(`尚未同步 ${symbol} 的产业链分析；当前仅开放已同步的自选股`);
        }
        return item;
      }

      function renderReport(item) {
        document.title = `${item.name}产业链分析｜*ST 离离原上韭`;
        document.querySelector("#meta").textContent =
          `${item.symbol} · ${item.industry} · ${item.industrySector}`;
        document.querySelector("#title").textContent = `${item.name}｜${item.chainName}`;
        document.querySelector("#rating").textContent = `${item.rating}产业链`;
        document.querySelector("#score").textContent = Number(item.strength).toFixed(0);
        document.querySelector("#summary").textContent = item.summary;
        document.querySelector("#position").textContent = item.companyPosition;
        document.querySelector("#upstream-summary").textContent = item.upstreamSupply;
        document.querySelector("#downstream-summary").textContent = item.downstreamDemand;
        appendChainNodes(document.querySelector("#upstream"), item.upstream, "upstream");
        appendChainNodes(document.querySelector("#downstream"), item.downstream, "downstream");
        document.querySelector("#transmission").textContent = item.transmissionLogic;
        document.querySelector("#outlook").textContent = item.outlook;
        appendTextList(document.querySelector("#indicators"), item.keyIndicators);
        appendTextList(document.querySelector("#catalysts"), item.catalysts);
        appendTextList(document.querySelector("#risks"), item.risks);

        const sources = document.querySelector("#sources");
        for (const source of item.sources || []) {
          const row = document.createElement("li");
          const link = document.createElement("a");
          link.href = source.url;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = source.title;
          row.append(link);
          const meta = document.createElement("span");
          meta.className = "source-meta";
          meta.textContent = [source.sourceType, source.publishedAt]
            .filter(Boolean)
            .join(" · ");
          row.append(meta);
          sources.append(row);
        }
        document.querySelector("#generated").textContent =
          `由 Codex 基于公开产业资料生成 · ${new Date(item.generatedAt).toLocaleString("zh-CN")} · 仅供研究参考`;
        loading.hidden = true;
        report.style.display = "block";
      }

      loadReport()
        .then(renderReport)
        .catch((cause) => showError(`产业链分析读取失败：${cause.message}`));
    </script>
  </body>
</html>
